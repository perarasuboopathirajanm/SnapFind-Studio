<html lang="en">
<head>
<meta charset="utf-8">
<meta name="author" content="{{ AUTHOR }}">
<meta name="copyright" content="(c) 2026 {{ AUTHOR }}">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{{ STUDIO_NAME }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23ff7a3d'/></svg>">
</head>
<body>
{% block topbar %}
<header class="topbar noprint">
  <a class="brand" href="/"><span class="dot"></span>{{ STUDIO_NAME }}</a>
  <nav class="nav">{% block nav %}{% endblock %}</nav>
</header>
{% endblock %}
{% block body %}{% endblock %}
{% block credit %}<p class="credit noprint">Built by <b>{{ AUTHOR }}</b> · © 2026 {{ AUTHOR }}. All rights reserved.</p>{% endblock %}
</body>
</html>
